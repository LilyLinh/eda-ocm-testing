---
- name: OpenShift alert remediation
  hosts: all
  sources:
    - name: ocm_alerts
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000
      filters:
        - eda.builtin.event_splitter:
            splitter_key: payload.alerts
            raise_error: true
  rules:
    - name: Remediate critical frontend crashloops
      condition: >
        event.status == "firing" and
        event.labels.alertname == "FrontendPodCrashLooping" and
        event.labels.severity == "critical"
      action:
        run_workflow_template:
          name: "OpenShift Self-Healing"
          organization: "Default"
          add_event_uuid_label: true
